<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isaac, recompiled</title>
<style>
  :root { --bg: #14110f; --panel: #211b17; --edge: #3a2f27; --ink: #e9dfcf; --dim: #a1937f; --accent: #e0a842; --bar: #7a5a2f; --err: #d24d3f; --ok: #79b36a;
          /* the menu's bone white, and the dimmer one its labels are drawn in */
          --load: #d7c9a7; --load-dim: #7d7263; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }   /* the page's own display rules must not outrank the hidden attribute */
  body { background: #000; color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; color: var(--ink); background: #2c241f; border: 1px solid var(--edge); border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #3a2f28; }
  button:disabled { opacity: .5; cursor: default; }
  /* the game fills the viewport: the largest 16:9 box it allows, centred on black, nothing else on the page */
  main { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  /* the canvas is 960x540 (the game's viewport) scaled to the largest 16:9 box the viewport allows, crisp */
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
  main:fullscreen { width: 100%; height: 100%; background: #000; }
  #canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* Keep early presentations covered until native readiness, independently
     of the remaining background downloads. */
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #000; }
  /* Isaac's dance: 84 frames of 42 px pixel art, a loop whose seam is smaller than an
     ordinary frame step, drawn on a canvas at a whole number of device pixels per art
     pixel (the script under the overlay), so every pixel stays square and steady. */
  #loader-isaac { width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
  #loader-isaac img { display: none; }
  #loader-isaac canvas { display: block; }
  @media (min-width: 700px) and (min-height: 500px) { #loader-isaac { width: 126px; height: 126px; } }
  #bar { width: 104px; height: 4px; background: #252525; }
  #bar-fill { width: 0; height: 100%; background: #e9dfcf; }
  #bar.indeterminate { overflow: hidden; }
  #bar.indeterminate #bar-fill { width: 25%; animation: startup-activity 1.2s ease-in-out infinite alternate; }
  @keyframes startup-activity {
    from { transform: translateX(0); }
    to { transform: translateX(300%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #bar.indeterminate #bar-fill { animation: none; transform: translateX(150%); }
  }
  #overlay.ready-to-play #bar, #overlay.ready-to-play #percentage { display: none; }

  #overlay .note { color: #a6a099; font: 12px/1.4 system-ui, sans-serif; max-width: 40em; text-align: center; }

  #overlay #status:empty { display: none; }
  #overlay.stats #status { width: auto; height: auto; font-size: 12px; background: none; }
  #stages { display: grid; grid-template-columns: max-content minmax(160px, 28vw) max-content; gap: 6px 12px; align-items: center; font-variant-numeric: tabular-nums; }
  #stages .name { text-align: right; color: var(--dim); }
  #stages .name.done { color: var(--ok); }
  #stages .name.active { color: var(--ink); }
  #stages progress { width: 100%; height: 10px; accent-color: var(--accent); }
  #stages .bytes { font-size: 12px; color: var(--dim); min-width: 11em; text-align: left; }
  #play { display: flex; align-items: center; justify-content: center; min-width: 104px; min-height: 44px; padding: 10px 24px;
           background: transparent; color: #e9dfcf; border: 2px solid #b0a89c; border-radius: 0; }
  #play img { display: block; width: 51px; height: 18px; image-rendering: pixelated; }
  #play:hover { background: #181818; border-color: #e9dfcf; }
  #play:focus-visible { outline: 2px solid #e9dfcf; outline-offset: 4px; }
  #streaming { font-variant-numeric: tabular-nums; }
  /* opt-in chrome: ?stats=1 shows the live status line, ?saves=1 the saves button */
  #fps { position: fixed; left: 6px; top: 4px; z-index: 3; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 0 3px #000; }
  #saves-btn { position: fixed; right: 6px; top: 4px; z-index: 3; font-size: 12px; padding: 2px 8px; opacity: .7; }
  #error { position: absolute; left: 4%; right: 4%; bottom: 4%; max-height: 60%; overflow: auto; background: rgba(33, 27, 23, .97); border: 1px solid var(--err); border-radius: 6px; padding: 10px 12px; box-sizing: border-box; }
  #error h3 { margin: 0 0 6px; font-size: 14px; color: var(--err); }
  #error.ended h3 { color: var(--ok); }
  #error pre { margin: 6px 0 0; font: 11px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; color: var(--dim); max-height: 34vh; overflow: auto; }
  #error .row { display: flex; gap: 8px; margin-top: 8px; }
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; min-width: 22em; max-width: 90vw; }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h3 { margin: 0 0 8px; }
  dialog .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  dialog table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; width: 100%; }
  dialog td { padding: 2px 6px; border-bottom: 1px solid var(--edge); }
  dialog td.n { text-align: right; }
  dialog .note { color: var(--dim); font-size: 12px; }
  #log { display: none; }
  /* Touch play: the game's own HUD and menus are the buttons (touch_controls.mjs).
     The page adds only sticks that appear under a thumb, the item bar drawn with
     the HUD's art, and a pause mark beside the minimap. Inside main, so all of it
     stays with the canvas in fullscreen. */
  html.isaac-touch-ready main { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  html.isaac-touch-ready #stage { width: min(calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)),
    calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 16 / 9)); }
  #touch-controls { position: fixed; inset: 0; z-index: 5; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .touch-hud, .touch-bar { pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; }
  .touch-hud { position: absolute; inset: 0; width: 100%; height: 100%; }
  .touch-bar { position: fixed; }
  /* A stick is a ring and a knob. Landscape shows it only under a thumb; portrait rests
     both, dimmed, under the picture. The knob springs home when the thumb lifts. */
  .touch-stick { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0;
    transition: opacity .2s ease-out; }
  .touch-stick.is-shown { opacity: .55; }
  .touch-stick.is-held { opacity: 1; transition-duration: .05s; }
  #touch-controls.is-cinematic .touch-stick { opacity: 0; }
  .touch-stick-base { position: absolute; left: -52px; top: -52px; width: 104px; height: 104px; box-sizing: border-box;
    border: 2px solid rgba(255, 255, 255, .22); border-radius: 50%; background: rgba(0, 0, 0, .16); }
  .touch-stick-knob { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 255, 255, .26); box-shadow: 0 0 0 1px rgba(0, 0, 0, .22); transform: translate(-50%, -50%);
    transition: transform .12s ease-out; }
  .touch-stick.is-held .touch-stick-knob { transition: none; }
  /* Upright, the menus get one pad under the picture: the same ring, a little brighter. */
  .touch-pad.is-shown { opacity: .7; }
  .touch-pad.is-held { opacity: 1; }
  /* The game's BACK paper, pinned in a corner of the menus that have none of their own. */
  .touch-back { position: fixed; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .45)); }
  /* The soft keyboard's anchor while the game asks for a seed: present, unseen. */
  .touch-keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; font-size: 16px; }
  html.isaac-touch #saves { box-sizing: border-box; min-width: 0; width: 480px;
    max-width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)); max-height: calc(100dvh - 24px); overflow: auto; }
  html.isaac-touch #saves button, html.isaac-touch #error button { min-height: 44px; min-width: 44px; }
  html.isaac-touch #saves-btn { display: none; }
  /* Portrait: the picture near the top, the thumbs below it, and the black around
     them lit by the room itself -- a small, blurred, dimmed copy of the picture
     (play.mjs draws it a few times a second). */
  #ambient { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%; object-fit: cover; pointer-events: none;
    filter: blur(26px) brightness(.36) saturate(1.3); }
  html.isaac-touch-ready #stage { z-index: 1; }
  @media (orientation: portrait) {
    html.isaac-touch-ready main { align-items: flex-start; padding-top: max(env(safe-area-inset-top), 4dvh); }
    html.isaac-touch-ready #stage { box-shadow: 0 6px 28px rgba(0, 0, 0, .55); }
  }
</style>
</head>
<body>
<main>
  <div id="stage">

<script>
// The loader's dance: one frame of the sheet every 50 ms, drawn at a whole number
// of device pixels per art pixel; nothing is drawn while the overlay is hidden.
(() => {
  const box = document.getElementById('loader-isaac'), overlay = document.getElementById('overlay');
  const sheet = box && box.querySelector('img'), canvas = box && box.querySelector('canvas');
  if (!sheet || !canvas || !canvas.getContext) return;
  const N = +sheet.dataset.frames, COLS = +sheet.dataset.cols, ART = +sheet.dataset.art, MS = +sheet.dataset.ms;
  const still = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const g = canvas.getContext('2d');
  let k = 0, dpr = 0, shown = -1, raf = 0, t0 = 0;
  function fit() {
    const ratio = window.devicePixelRatio || 1, room = box.clientWidth || 84;
    const next = Math.max(1, Math.round(room * ratio / ART));
    if (next === k && ratio === dpr) return;
    k = next; dpr = ratio; shown = -1;
    canvas.width = canvas.height = ART * k;
    canvas.style.width = canvas.style.height = `${ART * k / ratio}px`;
  }
  function draw(t) {
    raf = requestAnimationFrame(draw);
    if (!t0) t0 = t;
    fit();
    const f = still.matches ? 0 : Math.floor((t - t0) / MS) % N;
    if (f === shown) return;
    shown = f;
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, canvas.width, canvas.height);
    g.drawImage(sheet, (f % COLS) * ART, Math.floor(f / COLS) * ART, ART, ART, 0, 0, ART * k, ART * k);
  }
  const run = () => { if (!raf && !overlay.hidden) raf = requestAnimationFrame(draw); };
  const stop = () => { cancelAnimationFrame(raf); raf = 0; };
  if (sheet.complete) run(); else sheet.addEventListener('load', run);
  new MutationObserver(() => { if (overlay.hidden) stop(); else if (sheet.complete) run(); })
    .observe(overlay, { attributes: true, attributeFilter: ['hidden'] });
})();
</script>
